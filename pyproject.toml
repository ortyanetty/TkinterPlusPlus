[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tkinterplusplus"
version = "0.1.0"
description = "Modern Tkinter widgets and a visual Python UI builder"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ortyanetty"}]
keywords = ["tkinter", "gui", "visual-editor", "widgets"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]

[project.scripts]
tkinterplus-builder = "tkinterplus.builder:main"

[project.urls]
Repository = "https://github.com/ortyanetty/TkinterPlusPlus"

[tool.setuptools.packages.find]
include = ["tkinterplus*"]
