[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tkinterplusplus"
version = "0.2.0"
description = "Modern Tkinter widgets and a visual Python UI builder"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "licenses/**/*"]
authors = [{name = "ortyanetty"}]
keywords = ["tkinter", "gui", "visual-editor", "widgets"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]

[project.scripts]
tkinterplus-builder = "tkinterplus.launcher:main"

[project.optional-dependencies]
editor = ["PyQt6>=6.7,<7"]
build = ["pyinstaller>=6.22.3,<7"]

[project.urls]
Repository = "https://github.com/ortyanetty/TkinterPlusPlus"

[tool.setuptools.packages.find]
include = ["tkinterplus*"]
